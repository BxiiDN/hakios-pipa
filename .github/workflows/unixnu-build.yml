# The iPadOS 17 build of pipa on GitHub's runners: the XNU 10063 kernel (with its prelink), the UniXNU EFI package
# and the uefi-pipa firmware, from the commits UPSTREAM pins, with hakios-pipa's patches applied.
#
# The macOS jobs follow UniXNU's own .github/workflows/macos.yml (macos-26, Xcode's iphoneos SDK): the path UniXNU
# builds with itself. The Linux job builds UniXNU's Linux toolchain (scripts/linux/setup-toolchain.py) and caches it,
# for the WSL2 route.
#
# Nothing derived from Apple software or vendor firmware is uploaded: no kernel, kernelcache, IPSW member, firmware
# volume or image. Only text logs, and a manifest of SHA-256 digests and sizes of what was built. A step that fails
# fails its job; nothing is skipped into a pass.
name: unixnu-build

on:
  workflow_dispatch:
  push:
    branches: [pipa-bringup]
    paths:
      - UPSTREAM
      - patches/unixnu/**
      - patches/unixnu-pipa/**
      - owner/owner-public.pem
      - scripts/fetch-unixnu.sh
      - scripts/lib.sh
      - tools/build_manifest.py
      - tools/candidate_provenance.py
      - tools/macho_fingerprint.py
      - tools/binary_diff.py
      - scripts/kernel-two-stage.sh
      - patches/stage-a/**
      - .github/workflows/unixnu-build.yml

permissions:
  contents: read

concurrency:
  group: unixnu-build-${{ github.sha }}
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

defaults:
  run:
    shell: bash

jobs:
  macos-kernel:
    # The kernel the port builds, with the owner key the builder supplies (docs/OWNER-KEY.md): the public half
    # committed as owner/owner-public.pem, or -- while there is none -- an ephemeral key made in the run. An ephemeral
    # kernel proves compile, link and prelink only: it authorizes no root and is never a boot candidate.
    name: macos-kernel
    runs-on: macos-26
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HAKIOS_WORK: ${{ github.workspace }}/../work
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Host tools
        run: |
          brew install bash coreutils llvm lld mtools dtc glslang
          command -v unifdef >/dev/null || { brew install unifdef; echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"; }
      - name: Toolchain report
        run: |
          sw_vers; uname -m; xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version
          clang --version | head -1; "$(brew --prefix llvm)/bin/clang" --version | head -1; python3 --version
      - name: Pinned UniXNU, UniXNU-pipa and hakios-pipa patches
        env:
          SKIP_UEFI_PIPA: '1'
        run: scripts/fetch-unixnu.sh
      - name: Owner key (public half only)
        run: |
          mkdir -p "$RUNNER_TEMP/owner"
          if [ -f owner/owner-public.pem ]; then
            cp owner/owner-public.pem "$RUNNER_TEMP/owner/owner-public.pem"; kind=owner
          else
            ( umask 077; openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/owner/ephemeral.pem" )
            openssl pkey -in "$RUNNER_TEMP/owner/ephemeral.pem" -pubout -out "$RUNNER_TEMP/owner/owner-public.pem"
            rm -f "$RUNNER_TEMP/owner/ephemeral.pem"   # nothing in this job signs; the private half is not kept
            kind=ephemeral
          fi
          modulus=$(openssl rsa -pubin -in "$RUNNER_TEMP/owner/owner-public.pem" -modulus -noout | cut -d= -f2)
          # VerifiedRoot anchor (kits/VerifiedRoot/tools/manifest.py public_anchor): VROOTKEY, modulus, 65537
          pin=$(python3 -c 'import hashlib,sys; print(hashlib.sha256(b"VROOTKEY"+bytes.fromhex(sys.argv[1])+b"\x01\x00\x01").hexdigest())' "$modulus")
          echo "owner key: $kind, anchor sha256 $pin"
          { echo "UNIXNU_OWNER_PUBLIC_KEY=$RUNNER_TEMP/owner/owner-public.pem"; echo "UNIXNU_OWNER_KEY_SHA256=$pin"
            echo "UNIXNU_OWNER_KEY_KIND=$kind"; } >> "$GITHUB_ENV"
      - name: Defconfig, fetch, status
        working-directory: ${{ env.HAKIOS_WORK }}/UniXNU
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./unixnu defconfig pipa_defconfig -D ../UniXNU-pipa
          ./unixnu fetch
          ./unixnu status --json | tee "$RUNNER_TEMP/status.json"
      # docs/BOOTSTRAP.md: the port's ABI builders qualify their drivers against an already prelinked kernel.
      - name: Stage A -- reference kernel without ShengHidInput and the legacy display archive (never a boot image)
        id: stage_a
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HAKIOS_EVIDENCE: ${{ runner.temp }}/public/two-stage
        run: scripts/kernel-two-stage.sh a
      - name: Storage ABI, static checks only (UniXNU audit-storage-interface.py on the stage-A kernel)
        continue-on-error: true
        env:
          HAKIOS_EVIDENCE: ${{ runner.temp }}/public/two-stage
        run: scripts/kernel-two-stage.sh storage-static
      - name: GPU userland -- Turnip libvulkan_freedreno.dylib and the AdrenoMetal bridge (ARM64/iOS 17)
        env:
          HAKIOS_EVIDENCE: ${{ runner.temp }}/public/two-stage
        run: scripts/kernel-two-stage.sh gpu-userland
      - name: Stage B -- the full board against the stage-A kernel (XNU, every archive, final link, prelink)
        id: stage_b
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HAKIOS_EVIDENCE: ${{ runner.temp }}/public/two-stage
        run: scripts/kernel-two-stage.sh b
      - name: Recheck -- ShengHidInput qualified again against the final kernel; its bindings must not move
        env:
          HAKIOS_EVIDENCE: ${{ runner.temp }}/public/two-stage
        run: scripts/kernel-two-stage.sh recheck
      - name: The end of each build log (failure only)
        if: failure()
        run: |
          for f in "$HAKIOS_WORK"/UniXNU/out/*/*/*/logs/*.log; do
            [ -f "$f" ] || continue
            echo "::group::$(basename "$f") (last 120 lines)"; tail -n 120 "$f"; echo "::endgroup::"
          done
      - name: Manifest of what was built
        if: always()
        run: |
          python3 tools/build_manifest.py "$HAKIOS_WORK/UniXNU" --status "$RUNNER_TEMP/status.json" \
            --out "$RUNNER_TEMP/public/kernel-manifest.json" --logs "$RUNNER_TEMP/public/logs"
          k="$HAKIOS_WORK/UniXNU/out/pipa/ipados-17.7.11-21H461/pipa/tree/build/verified-root-key/key.json"
          [ -f "$k" ] && cp "$k" "$RUNNER_TEMP/public/owner-key.json" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-logs-and-manifest
          path: ${{ runner.temp }}/public/
          retention-days: 14
      - name: Remove proprietary inputs
        if: always()
        run: rm -rf "$HAKIOS_WORK/UniXNU/out/ipsw" "$HAKIOS_WORK"/UniXNU/out/*/kernel "$HAKIOS_WORK/UniXNU/out/feeds" "$HAKIOS_WORK/UniXNU-pipa/.cache/firmware" "$HAKIOS_WORK"/UniXNU/out/*/*/*/stage-a

  macos-firmware:
    runs-on: macos-26
    timeout-minutes: 240
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HAKIOS_WORK: ${{ github.workspace }}/../work
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Host tools
        run: |
          brew install bash coreutils llvm lld mtools dtc nasm mono
          "$(brew --prefix llvm)/bin/clang" --version | head -1; nasm -v; mono --version | head -1
      - name: Pinned UniXNU, UniXNU-pipa, uefi-pipa and hakios-pipa patches
        run: scripts/fetch-unixnu.sh
      - name: Mu-Silicium Python requirements
        run: python3 -m pip install -r "$HAKIOS_WORK/uefi-pipa/pip-requirements.txt"
      - name: Defconfig and fetch
        working-directory: ${{ env.HAKIOS_WORK }}/UniXNU
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./unixnu defconfig pipa_defconfig -D ../UniXNU-pipa
          ./unixnu fetch
          ./unixnu status --json | tee "$RUNNER_TEMP/status.json"
      - name: Submodules of every fetched EDK2/Mu feed (package and uefi-pipa builds)
        # The package needs libfdt, mipisyst and the BaseTools brotli; pipaPkg also needs
        # MdeModulePkg/Library/BrotliCustomDecompressLib/brotli (MdeModulePkg.dec(31), error 000E in run 45077836807).
        working-directory: ${{ env.HAKIOS_WORK }}/UniXNU
        run: |
          for d in out/feeds/*/; do
            [ -f "$d/.gitmodules" ] || continue
            echo "== $d"; git -C "$d" config -f .gitmodules --get-regexp '^submodule\..*\.path$' | cut -d' ' -f2
            git -C "$d" submodule update --init --depth 1 --jobs 4
          done
      - name: Build the UniXNU EFI package
        id: package
        working-directory: ${{ env.HAKIOS_WORK }}/UniXNU
        run: ./unixnu build package
      - name: Build uefi-pipa (Mu-Silicium pipaPkg with UniXNU and DarwinBoot)
        id: firmware
        working-directory: ${{ env.HAKIOS_WORK }}/UniXNU
        env:
          UNIXNU_UEFI: ${{ env.HAKIOS_WORK }}/uefi-pipa
        run: ./unixnu build firmware --uefi ../uefi-pipa
      - name: UEFI reproducibility -- a second clean build in the same environment, compared byte by byte
        # Session 4 bb3da32b... and session 5 6940dbff... from the same pins: find out what differs.
        continue-on-error: true
        working-directory: ${{ env.HAKIOS_WORK }}/UniXNU
        env:
          UNIXNU_UEFI: ${{ env.HAKIOS_WORK }}/uefi-pipa
        run: |
          fd=../uefi-pipa/Build/pipaPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd
          mkdir -p "$RUNNER_TEMP/repro" "$RUNNER_TEMP/public"
          cp "$fd" "$RUNNER_TEMP/repro/first.fd"
          ( cd ../uefi-pipa/Build/pipaPkg && find . -name '*.efi' -type f | sort | xargs shasum -a 256 ) > "$RUNNER_TEMP/repro/first-efi.txt"
          rm -rf ../uefi-pipa/Build
          ./unixnu build firmware --uefi ../uefi-pipa > "$RUNNER_TEMP/repro/second-build.log" 2>&1 || { tail -40 "$RUNNER_TEMP/repro/second-build.log"; exit 1; }
          cp "$fd" "$RUNNER_TEMP/repro/second.fd"
          ( cd ../uefi-pipa/Build/pipaPkg && find . -name '*.efi' -type f | sort | xargs shasum -a 256 ) > "$RUNNER_TEMP/repro/second-efi.txt"
          shasum -a 256 "$RUNNER_TEMP"/repro/*.fd
          echo "== .efi files that differ between the two builds"
          diff "$RUNNER_TEMP/repro/first-efi.txt" "$RUNNER_TEMP/repro/second-efi.txt" | grep '^[<>]' | head -40 || true
          python3 "$GITHUB_WORKSPACE/tools/binary_diff.py" "$RUNNER_TEMP/repro/first.fd" "$RUNNER_TEMP/repro/second.fd" \
            --json "$RUNNER_TEMP/public/uefi-repro-diff.json"
      - name: The end of each build log (failure only)
        if: failure()
        run: |
          for f in "$HAKIOS_WORK"/UniXNU/out/*/*/*/logs/*.log; do
            [ -f "$f" ] || continue
            echo "::group::$(basename "$f") (last 120 lines)"; tail -n 120 "$f"; echo "::endgroup::"
          done
      - name: Manifest of what was built
        if: always()
        run: |
          python3 tools/build_manifest.py "$HAKIOS_WORK/UniXNU" --uefi "$HAKIOS_WORK/uefi-pipa" --status "$RUNNER_TEMP/status.json" \
            --out "$RUNNER_TEMP/public/firmware-manifest.json" --logs "$RUNNER_TEMP/public/logs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-logs-and-manifest
          path: ${{ runner.temp }}/public/
          retention-days: 14

  linux-toolchain:
    # UniXNU's Linux toolchain for the WSL2 route: patched clang, cctools-port ld64, mig, iig, lzfse. Hours the first
    # time; the result is cached by the digest of setup-toolchain.py, which pins every source it builds.
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      HAKIOS_WORK: ${{ github.workspace }}/../work
      UNIXNU_TOOLCHAIN: /opt/unixnu-linux
    steps:
      - uses: actions/checkout@v5
      - name: Pinned UniXNU
        env:
          SKIP_UEFI_PIPA: '1'
        run: scripts/fetch-unixnu.sh
      - name: Cache key
        id: key
        run: echo "key=unixnu-linux-$(sha256sum "$HAKIOS_WORK/UniXNU/scripts/linux/setup-toolchain.py" | cut -c1-16)-$(sha256sum "$HAKIOS_WORK"/UniXNU/scripts/linux/*.patch 2>/dev/null | sha256sum | cut -c1-8)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: /opt/unixnu-linux
          key: ${{ steps.key.outputs.key }}
      - name: Host packages (setup-toolchain.py --print-packages)
        run: |
          sudo apt-get update
          sudo bash -c "$(python3 "$HAKIOS_WORK/UniXNU/scripts/linux/setup-toolchain.py" --print-packages | grep -v '^apt-get update')"
      - name: Build the toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/public"
          sudo -E TMPDIR="$RUNNER_TEMP" python3 "$HAKIOS_WORK/UniXNU/scripts/linux/setup-toolchain.py" --package-manager none \
            -j "$(nproc)" /opt/unixnu-linux 2>&1 | tee "$RUNNER_TEMP/public/setup-toolchain.log"
      - name: Check the toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/public"
          sudo python3 "$HAKIOS_WORK/UniXNU/scripts/linux/setup-toolchain.py" --check /opt/unixnu-linux 2>&1 | tee "$RUNNER_TEMP/public/toolchain-check.log"
          { /opt/unixnu-linux/llvm/bin/clang --version | head -1
            for f in llvm/bin/clang CommandLineTools/usr/bin/ld CommandLineTools/usr/libexec/migcom XcodeDefault.xctoolchain/usr/bin/iig bin/lzfse; do
              [ -e "/opt/unixnu-linux/$f" ] && echo "$(sha256sum "/opt/unixnu-linux/$f" | cut -c1-64) $f" || echo "MISSING $f"
            done; } | tee "$RUNNER_TEMP/public/toolchain-versions.txt"
          ! grep -q '^MISSING' "$RUNNER_TEMP/public/toolchain-versions.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-toolchain-logs
          path: ${{ runner.temp }}/public/
          retention-days: 14
